<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LMS{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="logo">▶ Aniplayer</a>
            <div class="nav-actions">
                <form action="/search" method="get" class="search-form">
                    <input type="text" name="q" placeholder="Search courses and videos..." value="{{ query | default('') }}">
                    <button type="submit" aria-label="Search">🔍</button>
                </form>
                <form action="/rescan" method="post" class="rescan-form">
                    <button type="submit">Rescan</button>
                </form>
            </div>
        </div>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <script src="/static/app.js"></script>
</body>
</html>
